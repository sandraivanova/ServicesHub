apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: servicehub
  namespace: servicehub
spec:
  ingressClassName: traefik
  rules:
    - host: servicehub.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
